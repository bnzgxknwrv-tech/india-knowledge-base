name: INDIA final authorization

on:
  push:
    branches:
      - agent/india8-cluster-casting
    paths:
      - 'governance/boot_checks/INDIA*_CHECK__*.json'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/india8-cluster-casting
          fetch-depth: 0

      - name: Resolve and verify check commit
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1

          mapfile -t rows < <(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)
          test "${#rows[@]}" -eq 1
          status="$(printf '%s\n' "${rows[0]}" | cut -f1)"
          path="$(printf '%s\n' "${rows[0]}" | cut -f2-)"
          test "${status}" = "A"
          [[ "${path}" =~ ^governance/boot_checks/INDIA[0-9]+_CHECK__[A-Z0-9]{6,32}\.json$ ]]

          python3 - "${path}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json, re, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          session = data.get("india_session", "")
          start_nonce = data.get("start_nonce", "")
          check_nonce = data.get("check_nonce", "")
          if not re.fullmatch(r"INDIA[0-9]+", session):
              raise SystemExit("invalid india_session")
          for name, value in [("start_nonce", start_nonce), ("check_nonce", check_nonce)]:
              if not re.fullmatch(r"[A-Z0-9]{6,32}", value):
                  raise SystemExit(f"invalid {name}")
          if start_nonce == check_nonce:
              raise SystemExit("check_nonce equals start_nonce")
          expected = f"governance/boot_checks/{session}_CHECK__{start_nonce}.json"
          if path != expected:
              raise SystemExit(f"filename/json mismatch: {path} != {expected}")
          print(f"session={session}")
          print(f"start_nonce={start_nonce}")
          print(f"check_nonce={check_nonce}")
          PY

      - name: Run canonical final authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/scripts/final_authorization.py \
            "${{ steps.meta.outputs.session }}" \
            "${{ steps.meta.outputs.start_nonce }}" \
            "${{ steps.meta.outputs.check_nonce }}"
