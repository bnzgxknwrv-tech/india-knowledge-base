name: INDIA V8.1 structural sanity
on:
  push:
    branches:
      - tmp/india14-final-auth-runner
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/india8-cluster-casting
          fetch-depth: 0
      - name: Run structural validator
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/scripts/validate_successor_boot.py > /tmp/out.txt 2>&1 || rc=$?
          cat /tmp/out.txt
          test "${rc:-0}" -eq 2
          grep -F "INDIA_BOOT_STRUCTURE: PASS" /tmp/out.txt
          grep -F "CONTENT_AUTHORIZATION: NOT_GRANTED" /tmp/out.txt
